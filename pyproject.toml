[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdmatrix"
version = "0.1.0"
description = "ICT PD Array Matrix: multi-timeframe PD array detection with a full lifecycle"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pdmatrix = "pdmatrix.__main__:main"

[tool.setuptools]
packages = ["pdmatrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
